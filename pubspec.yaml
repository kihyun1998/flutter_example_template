name: flutter_example_template
description: "An example-app shell for Flutter packages: a preview stage at three widths or at 1:1, a device wall, a code pane and a settings panel, driven through ports so it names no subject."
version: 0.4.0
repository: https://github.com/kihyun1998/flutter_example_template
issue_tracker: https://github.com/kihyun1998/flutter_example_template/issues

topics:
  - example
  - gallery
  - showcase
  - preview
  - responsive

environment:
  # Set by the two dependencies below, both of which declare exactly this
  # floor: `flutter_smooth_wheel_scroll` needs it, and `flutter_syntax_highlight`
  # took it from there. Nothing in this package's own code sets it — that was
  # `CardThemeData`, at 3.27.0, which is now under the floor.
  # ADR-0015 records the move and ADR-0011 the measurement it repeats.
  #
  # **No count, deliberately.** A number of tests here has nowhere to be
  # checked; the claim that matters is that both suites pass at the floor, and
  # CI holds that on every push. The top of the range is held by CI too: its
  # `latest stable` legs run the same suites against whatever stable is.
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # The third and fourth entries on a list that was always described as
  # growing one dependency at a time, on purpose — `portable_seam_test.dart`
  # holds the rule. ADR-0012 records the tokenizer; ADR-0015 records the wheel
  # motion the Code pane takes from the other, and the floor both brought.
  flutter_syntax_highlight: ^0.4.0
  flutter_smooth_wheel_scroll: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Shown on the package page. They ship because `docs/images/` ships: a
# `.pubignore` that excluded it also replaced the root `.gitignore` — pub reads
# one or the other, not both — and pulled `build/` and `.dart_tool/` back in,
# taking the archive from 705 KB to 29 MB. Repeating the ignore list to get it
# back out is a second roster kept in step by hand.
#
# The cost is pub's layout warning about a plural top-level `docs/`. It stays
# plural: `docs/agents/` is where this repository's agent tooling looks, by a
# convention that is not pub's to set.
screenshots:
  - description: "The shell at desktop width: a category menu, a preview stage and a knob region."
    path: docs/images/shell.png
  - description: "The Device Wall: desktop, tablet and phone frames at once, live, over one set of knobs."
    path: docs/images/device-wall.png
  - description: "The Code pane, showing a recipe's own source read out of the asset bundle."
    path: docs/images/code-pane.png
  - description: "The settings panel with a preset applied, and the line that earns it its name."
    path: docs/images/settings-panel.png

flutter:
  # The shell draws Material icons throughout — the menu, the viewport bar, the
  # Code pane's copy button — and a consumer inherits the need for the font.
  uses-material-design: true

name: flutter_example_template
description: "An example-app shell for Flutter packages: a preview stage at three widths, a device wall, a code pane and a settings panel, all driven through ports so it names no subject."
version: 0.1.0
repository: https://github.com/kihyun1998/flutter_example_template
issue_tracker: https://github.com/kihyun1998/flutter_example_template/issues

topics:
  - example
  - gallery
  - showcase
  - preview
  - responsive

environment:
  # Measured at both ends rather than inherited from whatever built it.
  # Both suites — 23 tests here, 11 in the example — pass and analyse clean
  # on 3.27.0 and on 3.41.9. 3.24.5 fails, with exactly one error:
  # `CardThemeData` in `example_theme.dart`, which Flutter added in 3.27.0
  # and which is now the only type `ThemeData.cardTheme` accepts. The top of
  # the range is held by CI rather than by memory: its `latest stable` legs
  # resolve 3.47.2 and run the same suites on every push.
  #
  # So one line sets this floor, and it is named here so the next person can
  # weigh moving it. The code below would in fact run lower — swapping that
  # line for the pre-3.27 `CardTheme` turned 3.24.5 fully green — and it is
  # not swapped, because no Flutter accepts both spellings. After that the
  # next wall is 3.22.0, where `WidgetStateProperty` and
  # `surfaceContainerLow` arrive.
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # The third entry on a list that was always described as growing one
  # dependency at a time, on purpose — `portable_seam_test.dart` holds the
  # rule, ADR-0012 records what taking this cost and what the copy had been
  # costing instead. It declares the same floor as this package, so it moves
  # nothing above.
  flutter_syntax_highlight: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A range, not `^6.0.0`. flutter_lints 6 needs Dart 3.8, which is above the
  # floor declared above — pinning it would mean the minimum this package
  # advertises is a version the package cannot be checked on. A consumer never
  # sees this either way, since dev dependencies are not inherited; the person
  # it would strand is whoever clones the repo at the floor to verify the
  # claim. Pub takes 6 on a current SDK and 5 at the floor.
  flutter_lints: ">=5.0.0 <7.0.0"

# Shown on the package page. They ship because `docs/images/` ships: a
# `.pubignore` that excluded it also replaced the root `.gitignore` — pub reads
# one or the other, not both — and pulled `build/` and `.dart_tool/` back in,
# taking the archive from 705 KB to 29 MB. Repeating the ignore list to get it
# back out is a second roster kept in step by hand.
#
# The cost is pub's layout warning about a plural top-level `docs/`. It stays
# plural: `docs/agents/` is where this repository's agent tooling looks, by a
# convention that is not pub's to set.
screenshots:
  - description: "The shell at desktop width: a category menu, a preview stage and a knob region."
    path: docs/images/shell.png
  - description: "The Device Wall: desktop, tablet and phone frames at once, live, over one set of knobs."
    path: docs/images/device-wall.png
  - description: "The Code pane, showing a recipe's own source read out of the asset bundle."
    path: docs/images/code-pane.png
  - description: "The settings panel with a preset applied, and the line that earns it its name."
    path: docs/images/settings-panel.png

flutter:
  # The shell draws Material icons throughout — the menu, the viewport bar, the
  # Code pane's copy button — and a consumer inherits the need for the font.
  uses-material-design: true
